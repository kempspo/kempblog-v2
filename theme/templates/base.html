<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block fulltitle %}{{ SITENAME }}{% endblock %}</title>
  <link rel="icon" href="{{ SITEURL }}/images/favicon.ico">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/style.css">
  <link rel="canonical" href="{{ SITEURL }}/{% block canonical_path %}{% endblock %}">
  {% if FEED_ALL_ATOM %}
  <link href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}" type="application/atom+xml" rel="alternate" title="{{ SITENAME }}">
  {% endif %}
  <meta name="description" content="{% block description %}This site holds thoughts, hobbies, and other interests.{% endblock %}">
  <meta property="og:site_name" content="{{ SITENAME }}">
  <meta property="og:title" content="{{ self.fulltitle() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="{{ SITEURL }}/{% block og_path %}{% endblock %}">
  <meta property="og:image" content="{{ SITEURL }}/images/profile.jpg">
  <meta property="og:image:alt" content="{{ SITENAME }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.fulltitle() }}">
  <meta name="twitter:description" content="{{ self.description() }}">
  <meta name="twitter:image" content="{{ SITEURL }}/images/profile.jpg">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="{{ SITEURL }}/">{{ SITENAME }}</a>
      <nav>
        <a href="{{ SITEURL }}/writing.html" {% block nav_writing %}{% endblock %}>Writing</a>
        <a href="{{ SITEURL }}/podcast.html" {% block nav_podcast %}{% endblock %}>Podcast</a>
        <a href="{{ SITEURL }}/about.html" {% block nav_about %}{% endblock %}>About</a>
        <button type="button" class="theme" id="theme">Dark</button>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      <p>© {{ COPYRIGHT_YEAR }} {{ COPYRIGHT_NAME }} · <a href="{{ CC_LICENSE_URL }}">CC BY-SA 4.0</a> · <a href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}">Atom</a></p>
    </footer>
  </div>
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/theme.js"></script>
</body>
</html>
